<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0909">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0909'/%3E%3Cpath d='M20 48V16h26v8H29v5h14v8H29v11z' fill='%23e5202e'/%3E%3C/svg%3E">
<title>Forge Gym | ئەندام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Noto+Kufi+Arabic:wght@600;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css?v=4">
</head>
<body class="portal">
<noscript><p style="padding:24px;text-align:center;color:#fff">JavaScript پێدڤییە بۆ ڤەکرنا ڤێ لاپەڕێ.</p></noscript>


<div class="wrap narrow">
  <div class="gstat" id="gstat" hidden><i></i><div><b id="gstatT"></b><small id="gstatM"></small></div></div>
  <header class="top">
    <div class="brand"><i></i><div>FORGE<small>GYM</small></div></div>
    <button class="ghost" id="btnOut" type="button" hidden>دەرکەفتن</button>
  </header>

  <!-- چوونە ژوورڤە -->
  <section class="login" id="login">
    <div class="hero" aria-hidden="true"><span>FORGE</span><small>GYM</small></div>
    <h1>چوونە ژوورڤەیا ئەندامان</h1>
    <p>کۆدێ خۆ یێ تایبەت بنڤیسە دا خشتەیا ڕاهێنانێ ببینی و بزانی ماوەیا ئەندامەتیا تە کەنگێ ب دوماهی دهێت.</p>
    <form id="loginForm" novalidate>
      <label for="code">کۆدێ تایبەت</label>
      <input id="code" class="codein" type="text" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX" maxlength="30">
      <label class="remember"><input id="remember" type="checkbox" checked> ل سەر ڤی ئامێری بمینیت</label>
      <div class="err" id="loginErr" role="alert"></div>
      <button class="btn-add wide" id="loginBtn" type="submit">چوونە ژوورڤە</button>
    </form>
    <p class="hint">کۆدێ تە ژ لایێ ڕاهێنەرێ قاعێ ڤە دهێتە دان. تنێ پیتێن ئینگلیزی و ژمارە.</p>
  </section>

  <!-- ڕووپەلێ ئەندامی -->
  <section id="me" hidden>
    <h2 class="hello" id="hello"></h2>
    <!-- دوو لاپەڕێن جیا: ئەندامەتی و خشتە -->
    <div class="ptabs" id="ptabs" role="tablist"><button type="button" class="on" data-p="card">ئەندامەتی</button><button type="button" data-p="plan">خشتەیا ڕاهێنانێ</button></div>

    <div data-pv="card">
    <div class="pcard" id="pcard">
      <div class="pc-top">
        <span class="tag" id="pcTag"></span>
        <span class="tag" id="pcPaid"></span>
      </div>
      <div class="pc-days"><b id="pcDays">0</b><span id="pcLabel">ڕۆژ ماینە</span></div>
      <div class="bar" aria-hidden="true"><i id="pcBar"></i></div>
      <dl class="pc-dates">
        <div><dt>دەستپێک</dt><dd id="pcStart"></dd></div>
        <div><dt>ب دوماهی هاتن</dt><dd id="pcEnd"></dd></div>
      </dl>
      <p class="pc-warn" id="pcWarn" hidden></p>
    </div>
    </div>

    <div data-pv="plan" hidden>
    <h3 class="sec">خشتەیا ڕاهێنانێ</h3>
    <div class="days" id="days"></div>
    </div>
  </section>
</div>

<div class="lb" id="lb" hidden><img id="lbImg" alt=""></div>
<script src="crypto.js?v=4"></script>
<script src="member.js?v=4"></script>
</body>
</html>
